name: Build and Test

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Setup
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          10.0.x
          11.0.x
    - name: Checkout
      uses: actions/checkout@v7
    - name: Build
      run: dotnet build -c Release
    - name: Test
      run: dotnet test -c Release --no-build
